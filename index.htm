<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Brothers 022</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2420;--mu:#6b746e;--ac:#1f6b4a;--bd:#e2e0d8;--bad:#b3392f;--warn:#b77a14;--ok:#1f6b4a}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--tx:#eceee9;--mu:#9aa39d;--ac:#4cb887;--bd:#2d352f;--bad:#e5766c;--warn:#e2a649;--ok:#4cb887}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
.w{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mu);display:block}.k b{font-size:20px}
input,select,button,textarea{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:120px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.t{text-align:left}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:13px}
.login{max-width:380px;margin:12vh auto}.login .row>*{flex:1 1 100%}
</style></head><body><div class="w" id="app"></div>
<script>
// ====== PUT YOUR SUPABASE DETAILS HERE (Project Settings > API) ======
const SUPABASE_URL="https://zjzatmkvinzhsqakgvtl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_YOwidqPDngVirzOsJwtSpw_Jvh_lAvW";
// =====================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const CAP=7500,YEAR=15000,A=document.getElementById("app");
const f=n=>"KES "+Number(n).toLocaleString();
let D={members:[],pays:[],admin:false,q:"",tab:"home",fy:"all",fm:"all",email:"",x:{ok:true,msgs:[],tg:[],els:[],opts:[],voted:[],off:[],res:{}}};let rec=/type=recovery/.test(location.hash);

function loginView(err,mode,ok){const up=mode==="up";A.innerHTML=`<div class="card login"><h1>Real Brothers 022</h1><p class="mu">${up?"Create your account with the email the Treasurer registered for you.":"Sign in to see your contributions."}</p>
<div class="row"><input id="em" type="email" placeholder="Email (username)"><input id="pw" type="password" placeholder="Password">${up?`<input id="pw2" type="password" placeholder="Confirm password"><button onclick="signup()">Create account</button>`:`<button onclick="login()">Sign in</button>`}</div>
<p class="bad">${err||""}</p><p class="ok">${ok||""}</p>
<p class="mu">${up?`<a href="#" onclick="loginView(0,0);return false">Back to sign in</a>`:`New member? <a href="#" onclick="loginView(0,'up');return false">Create account</a> &middot; <a href="#" onclick="forgot();return false">Forgot password</a>`}</p></div>`}
async function signup(){const e=em.value.trim().toLowerCase(),p=pw.value;
if(!e||p.length<6)return loginView("Enter your email and a password of at least 6 characters.","up");
if(p!==pw2.value)return loginView("Passwords do not match.","up");
const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
if(error)return loginView(error.message,"up");
if(data.session)return load();
if(data.user&&data.user.identities&&data.user.identities.length===0)return loginView("This email already has an account. Sign in, or use Forgot password.");
loginView(0,0,"Account created. Check your email and click the confirmation link, then sign in.")}
async function forgot(){const e=em.value.trim();if(!e)return loginView("Type your email above first.");
const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
loginView(error?error.message:0,0,error?"":"Password reset email sent. Check your inbox.")}
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){rec=true;A.innerHTML=`<div class="card login"><h1>Set a new password</h1><div class="row"><input id="np" type="password" placeholder="New password"><button onclick="setPw()">Save password</button></div></div>`}});
async function setPw(){if(np.value.length<6)return alert("Use at least 6 characters.");const {error}=await sb.auth.updateUser({password:np.value});if(error)return alert(error.message);rec=false;load()}
async function login(){const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
if(error)return loginView("Wrong email or password.");load()}
async function logout(){await sb.auth.signOut();D.tab="home";loginView()}

async function load(){
A.innerHTML='<p class="mu">Loading…</p>';
const [m,p,a]=await Promise.all([sb.from("members").select("*").order("name"),sb.from("payments").select("*").order("id",{ascending:false}),sb.rpc("is_admin")]);
if(m.error||p.error)return loginView("Could not load data. Check your Supabase setup.");
D.members=m.data;D.pays=p.data;D.admin=a.data===true;D.email=(await sb.auth.getSession()).data.session.user.email;await loadX();render()}

function calc(m){const mine=D.pays.filter(x=>x.member_id===m.id),w={};
let sav=0;mine.forEach(x=>{if(x.kind==="savings")sav+=+x.amount;else w[x.wave]=(w[x.wave]||0)+ +x.amount});
const g=k=>w[k]||0;return{sav,w1:g("W1-2025"),w2:g("W2-2025"),w3:g("W1-2026"),w4:g("W2-2026"),d26:g("W1-2026")+g("W2-2026"),d25:g("W1-2025")+g("W2-2025"),log:mine}}
function status(v){return v>=YEAR?["Complete","ok"]:v>=CAP?["On track","ok"]:v>=CAP/2?["Behind","warn"]:["At risk","bad"]}
const hdr=t=>`<header><h1>${t}</h1><button class="g" onclick="logout()">Sign out</button></header>${nav()}`;

function render(){if(rec)return;if(D.tab==="msg")return msgView();if(D.tab==="vote")return voteView();if(D.tab==="fin"&&D.admin)return finView();
if(D.admin)return adminView();
const m=D.members[0];if(!m)return A.innerHTML=hdr("Real Brothers 022")+'<div class="card">Your email is not linked to a member yet. Please ask the Treasurer.</div>';
memberView(m)}

function adminView(){
const all=D.members.map(m=>({m,c:calc(m)})),rows=all.filter(r=>r.m.status!=="left"),left=all.filter(r=>r.m.status==="left"),ben=all.filter(r=>r.m.benefited);
const tot=rows.reduce((a,r)=>a+r.c.d26,0),sav=rows.reduce((a,r)=>a+r.c.sav,0);
const risk=rows.filter(r=>status(r.c.d26)[1]==="bad").length,done=rows.filter(r=>r.c.d26>=YEAR).length;
const opts=D.members.map(m=>`<option value="${m.id}">${m.name}${m.status==="left"?" (left)":""}</option>`).join("");
const btn=m=>`<button class="g" onclick="rep(${m.id})">PDF</button> <button class="g" onclick="csv(${m.id})">CSV</button> <button class="g" onclick="mail(${m.id})">Email</button>`;
const body=rows.filter(r=>r.m.name.toLowerCase().includes(D.q.toLowerCase())).map(({m,c})=>{const s=status(c.d26);
return`<tr><td>${m.name}<br><span class="mu">${m.id_number?"Acc: "+m.id_number:"no ID number"}</span>${m.benefited?' <span class="tag ok">Benefited</span>':''}${m.email?"":' <span class="mu">(no email)</span>'}</td><td>${f(pp(m))}</td><td>${f(c.sav)}</td><td>${f(c.d25)}</td><td>${f(c.d26)}</td><td>${f(Math.max(0,YEAR-c.d26))}</td><td>${f(mon(m).owing)}</td><td>${f(dowOd(c))}</td><td><b>${f(bal(m).total)}</b></td><td><span class="tag ${s[1]}">${s[0]}</span></td><td>${btn(m)}</td></tr>`}).join("");
const benT=ben.map(({m})=>`<tr><td>${m.name}</td><td>${m.benefit_amount?f(m.benefit_amount):"-"}</td><td>${m.benefit_date||"-"}</td><td>${m.status==="left"?"Left":"Active"}</td></tr>`).join("")||'<tr><td colspan="4" class="mu">None recorded yet.</td></tr>';
const leftT=left.map(({m,c})=>`<tr><td>${m.name}</td><td>${f(c.d25+c.d26)}</td><td>${m.left_on||"-"}</td><td><span class="tag ${m.refund_status==="refunded"?"ok":"warn"}">${m.refund_status==="refunded"?"Refunded":"Not refunded"}</span></td><td>${m.refund_amount?f(m.refund_amount):"-"}</td><td>${btn(m)}</td></tr>`).join("")||'<tr><td colspan="6" class="mu">No former members recorded.</td></tr>';
A.innerHTML=hdr("Admin dashboard")+`<div class="grid">
<div class="k"><small>Active members</small><b>${rows.length} / 25</b></div><div class="k"><small>Dowry fund 2026</small><b>${f(tot)}</b></div>
<div class="k"><small>Target 2026</small><b>${f(rows.length*YEAR)}</b></div><div class="k"><small>Savings held</small><b>${f(sav)}</b></div>
<div class="k"><small>Completed 15,000</small><b>${done}</b></div><div class="k"><small>At risk</small><b class="bad">${risk}</b></div>
<div class="k"><small>Benefited</small><b>${ben.length}</b></div><div class="k"><small>Former members</small><b>${left.length}</b></div></div>
<div class="card"><h2>Record a payment</h2><div class="row">
<select id="pm">${opts}</select>
<select id="pt"><option value="savings">Monthly savings (200)</option><option value="dowry">Dowry contribution (1,250)</option></select>
<input id="pa" type="number" min="1" placeholder="Amount"><button onclick="pay()">Add</button></div>
<p class="mu">Dowry payments fill Wave 1 2026 up to 7,500, then Wave 2 2026.</p></div>
<div class="card"><h2>Attendance (who was absent)</h2><div class="row"><select id="am" onchange="attList()">${attMonths()}</select></div><div id="al"></div><p class="mu">Rules: present and paid 200. Present but not paid 300 (200 + 100). Absent and paid 400. Absent and not paid 500. Ticked names are treated as absent.</p></div>
<div class="card"><h2>Add a member</h2><div class="row"><input id="nm" placeholder="Full name"><input id="ne" type="email" placeholder="Login email (username)"><input id="ni" placeholder="ID number (account no.)">
<select id="ns"><option value="active">Active member</option><option value="left">Former member (left)</option></select>
<label class="mu"><input id="nb" type="checkbox" style="min-width:0"> Already benefited</label><button onclick="addMember()">Add member</button></div></div>
<div class="card"><h2>Benefit and exit</h2><div class="row"><select id="mm" onchange="hint()">${opts}</select></div><p class="mu" id="hint"></p>
<div class="row"><input id="bamt" type="number" placeholder="Amount received"><input id="bdt" type="date"><button onclick="saveBenefit()">Mark as benefited</button><button class="g" onclick="clearBenefit()">Remove benefit</button></div>
<div class="row"><select id="rs"><option value="not_refunded">Not refunded</option><option value="refunded">Refunded</option></select>
<input id="ramt" type="number" placeholder="Refund amount"><button onclick="markLeft()">Mark as left</button><button class="g" onclick="reinstate()">Reinstate</button></div>
<p class="mu">Per the constitution a member who resigns gets 50% of their yearly contributions, paid after 3 years. To update a refund later, select the member and use Mark as left again.</p></div>
<div class="card"><h2>Member login (email) and account number (ID)</h2><div class="row"><select id="em2">${D.members.map(m=>`<option value="${m.id}">${m.name}${m.email?" ("+m.email+")":""}</option>`).join("")}</select>
<input id="em3" type="email" placeholder="Login email (username)"><input id="em4" placeholder="ID number (account no.)"><button onclick="setEmail()">Save</button></div>
<p class="mu">Create the member's login in Supabase (Authentication > Users) with this same email.</p></div>
<div class="card"><h2>Active members</h2>${flt()}<div class="row"><input id="q" placeholder="Search member" value="${D.q}" oninput="D.q=this.value;adminView();q.focus()"></div>
<div class="tw"><table><tr><th>Member</th><th>Paid in period</th><th>Savings</th><th>Dowry 2025</th><th>Dowry 2026</th><th>Balance to 15,000</th><th>Monthly owing</th><th>Dowry overdue</th><th>Total owing</th><th>Status</th><th>Report</th></tr>${body}</table></div>
<p class="mu">On track = 7,500 or more (June target). Behind = 3,750 to 7,499. At risk = below 3,750.</p></div>
<div class="card"><h2>Members who have benefited</h2><div class="tw"><table><tr><th>Member</th><th>Amount</th><th>Date</th><th>Now</th></tr>${benT}</table></div></div>
<div class="card"><h2>Former members</h2><div class="tw"><table><tr><th>Member</th><th>Dowry paid</th><th>Left on</th><th>Refund</th><th>Refund amount</th><th>Report</th></tr>${leftT}</table></div></div>`;
if(document.getElementById("mm"))hint();attList()}
const upd=async(id,o)=>{const {error}=await sb.from("members").update(o).eq("id",id);if(error)return alert(error.message);load()};
const saveBenefit=()=>upd(+mm.value,{benefited:true,benefit_amount:+bamt.value||null,benefit_date:bdt.value||null});
const clearBenefit=()=>upd(+mm.value,{benefited:false,benefit_amount:null,benefit_date:null});
const markLeft=()=>{const m=D.members.find(x=>x.id===+mm.value);upd(m.id,{status:"left",left_on:m.left_on||new Date().toISOString().slice(0,10),refund_status:rs.value,refund_amount:+ramt.value||null})};
const reinstate=()=>upd(+mm.value,{status:"active",left_on:null,refund_status:null,refund_amount:null});
async function addMember(){const n=nm.value.trim();if(!n)return;
const o={name:n,status:ns.value,benefited:nb.checked};if(ne.value.trim())o.email=ne.value.trim().toLowerCase();if(ni.value.trim())o.id_number=ni.value.trim();if(o.status==="left"){o.left_on=new Date().toISOString().slice(0,10);o.refund_status="not_refunded"}
const {error}=await sb.from("members").insert(o);if(error)return alert(error.message);load()}
function hint(){const m=D.members.find(x=>x.id===+mm.value);if(!m)return;const c=calc(m);
document.getElementById("hint").textContent="Dowry paid in total: "+f(c.d25+c.d26)+". Suggested refund (50%): "+f((c.d25+c.d26)/2)+(m.benefited?". Benefited: "+(m.benefit_amount?f(m.benefit_amount):"yes"):"")}
async function pay(){const id=+pm.value,t=pt.value,a=+pa.value;if(!(a>0))return;
const m=D.members.find(x=>x.id===id);let ins=[];
if(t==="savings")ins.push({member_id:id,kind:"savings",amount:a});
else{const c=calc(m),room=Math.max(0,CAP-c.w3),x=Math.min(a,room);
if(x>0)ins.push({member_id:id,kind:"dowry",amount:x,wave:"W1-2026"});
if(a-x>0)ins.push({member_id:id,kind:"dowry",amount:a-x,wave:"W2-2026"})}
const {error}=await sb.from("payments").insert(ins);if(error)return alert("Could not save: "+error.message);load()}
async function setEmail(){const e=em3.value.trim().toLowerCase(),i=em4.value.trim(),o={};if(e)o.email=e;if(i)o.id_number=i;if(!e&&!i)return;
const {error}=await sb.from("members").update(o).eq("id",+em2.value);if(error)return alert(error.message.includes("duplicate")?"That email or ID number is already used by another member.":error.message);load()}

function memberView(m){const c=calc(m),s=status(c.d26),p=Math.min(100,c.d26/YEAR*100);
const w=(l,x)=>`<tr><td>${l}</td><td>${f(x)}</td><td><div class="bar"><i style="width:${Math.min(100,x/CAP*100)}%"></i></div></td></tr>`;
A.innerHTML=hdr("Hello, "+m.name.split(" ")[0])+`<p class="mu">Account no: ${m.id_number||"not set"} · Username: ${m.email||""}</p><div class="grid">
<div class="k"><small>My savings</small><b>${f(c.sav)}</b></div><div class="k"><small>Dowry paid 2026</small><b>${f(c.d26)}</b></div>
<div class="k"><small>Balance to 15,000</small><b>${f(Math.max(0,YEAR-c.d26))}</b></div><div class="k"><small>Status</small><b class="${s[1]}">${s[0]}</b></div></div>
<div class="card"><h2>Year target: ${f(YEAR)}</h2><div class="bar"><i style="width:${p}%"></i></div><p class="mu">${p.toFixed(0)}% complete. Monthly due: KES 1,450 (200 savings + 1,250 dowry).</p></div>
<div class="card"><h2>Dowry waves</h2><div class="tw"><table><tr><th>Wave</th><th>Paid (of 7,500)</th><th>Progress</th></tr>
${w("Wave 1 2025",c.w1)}${w("Wave 2 2025",c.w2)}${w("Wave 1 2026",c.w3)}${w("Wave 2 2026",c.w4)}</table></div></div>
<div class="card"><h2>Recent payments</h2>${c.log.slice(0,8).map(l=>`<div class="row mu"><span>${l.paid_on}</span><span>${l.kind==="savings"?"Savings":"Dowry"}</span><span>${f(l.amount)}</span></div>`).join("")||'<p class="mu">No payments yet.</p>'}</div>
${myContrib(m)}
<div class="card"><h2>Balance summary</h2>${balT(m)}</div>
<div class="card"><h2>Monthly contributions (200 per month)</h2>${monT(m)}</div>
<div class="card"><h2>My statement</h2><div class="row"><button onclick="rep(${m.id})">Print / save as PDF</button><button class="g" onclick="csv(${m.id})">Download CSV</button></div></div>

function mon(m){const n=new Date(),st=2025*12+11,en=Math.max(n.getFullYear()*12+n.getMonth(),st),pay={};
D.pays.forEach(x=>{if(x.member_id===m.id&&x.kind==="savings"){const p=x.paid_on.split("-"),k=+p[0]*12+(+p[1]-1);if(k>=st)pay[k]=(pay[k]||0)+ +x.amount}});
const held=D.pays.some(x=>{if(x.kind!=="savings")return false;const q=x.paid_on.split("-");return +q[0]*12+(+q[1]-1)===en});
const rows=[];let cp=0,cd=0;for(let k=st;k<=en;k++){const p=pay[k]||0,key=Math.floor(k/12)+"-"+String(k%12+1).padStart(2,"0"),ar=(D.x.att||[]).find(a=>a.member_id===m.id&&a.month===key),abs=ar?ar.absent:p===400,pen=p===0&&(k<en||held)?100:0,dd=200+(abs?200:0)+pen;cp+=p;cd+=dd;rows.push({l:MN[k%12]+" "+Math.floor(k/12),p,d:dd,pen,abs,cp,cd,bal:cp-cd})}
rows.forEach(x=>x.cv=[]);
rows.forEach((x,i)=>{const j=rows.findIndex((y,t)=>t>=i&&y.cp>=x.cd);if(j<0)x.cl="Unpaid";else{x.cl=j===i?(x.p>0?"Paid on time":"Covered by earlier payment"):"Paid in "+rows[j].l+" (late)";if(j!==i)rows[j].cv.push(x.l)}});
const last=rows[rows.length-1];return{rows,owing:Math.max(0,-last.bal),credit:Math.max(0,last.bal)}}
function monT(m){const q=mon(m);return`<div class="tw"><table class="mt"><tr><th>Month</th><th>Due</th><th>Paid this month</th><th>Balance</th><th class="t">Status</th><th class="t">This payment also covers</th></tr>${q.rows.map(x=>`<tr><td>${x.l}</td><td>${f(x.d)}${x.abs||x.pen?`<br><small>${[x.abs?"absent +200":"",x.pen?"not paid at meeting +100":""].filter(Boolean).join(", ")}</small>`:""}</td><td>${x.p?f(x.p):"-"}</td><td>${x.bal<0?"Owing "+f(-x.bal):x.bal>0?"Credit "+f(x.bal):"Nil"}</td><td class="t">${x.cl}</td><td class="t">${x.cv.length?x.cv.join(", "):""}</td></tr>`).join("")}</table></div><p class="mu">Monthly contributions owing now: ${f(q.owing)}${q.credit?" · Extra/credit (fines or advance): "+f(q.credit):""}</p>`}
