function mon(m){const n=new Date(),st=2025*12+11,en=Math.max(n.getFullYear()*12+n.getMonth(),st),pay={};
D.pays.forEach(x=>{if(x.member_id===m.id&&x.kind==="savings"){const p=x.paid_on.split("-"),k=+p[0]*12+(+p[1]-1);if(k>=st)pay[k]=(pay[k]||0)+ +x.amount}});

const rows=[];let cp=0,cd=0;for(let k=st;k<=en;k++){const p=pay[k]||0,key=Math.floor(k/12)+"-"+String(k%12+1).padStart(2,"0"),ar=(D.x.att||[]).find(a=>a.member_id===m.id&&a.month===key),abs=ar?ar.absent:p===400,pen=p===0&&(k<en||held)?100:0,dd=200+(abs?200:0)+pen;cp+=p;cd+=dd;rows.push({l:MN[k%12]+" "+Math.floor(k/12),key,p,d:dd,pen,abs,cp,cd,bal:cp-cd})}
rows.forEach(x=>x.cv=[]);
